name: Backend image

# main -> build + push | v* tags -> build + push (semver) | PRs -> build only.
# Path filters are not applied to tag pushes, so every v* tag builds both images.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-image.yml"
      - ".github/workflows/docker-image.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-image.yml"
      - ".github/workflows/docker-image.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    uses: ./.github/workflows/docker-image.yml
    with:
      component: backend
