apiVersion: apps/v1
kind: Deployment
metadata:
  name: ev-listing-auditor-fe
spec:
  selector:
    matchLabels:
      app: ev-listing-auditor-fe
  template:
    metadata:
      labels:
        app: ev-listing-auditor-fe
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: ev-listing-auditor-fe
          image: ghcr.io/sdrfsh/ev-listing-auditor-frontend:sha-87abce1
          env:  
            - name: API_URL
              value: https://sahar-drfsh.nutria-cobia.ts.net/api
          ports:
          - containerPort: 3001
